name: Performance Budget Check

on:
  push:
    branches:
      - main
      - translate-ukrainian-acfs
    paths:
      - 'apps/web/components/jargon.tsx'
      - 'apps/web/lib/feature-flags.ts'
      - 'apps/web/lib/__tests__/feature-flags.test.ts'
      - 'apps/web/lib/jargon.ts'
      - 'apps/web/package.json'
      - 'scripts/benchmark-jargon.js'
  pull_request:
    branches:
      - main
      - translate-ukrainian-acfs
    paths:
      - 'apps/web/components/jargon.tsx'
      - 'apps/web/lib/feature-flags.ts'
      - 'apps/web/lib/__tests__/feature-flags.test.ts'
      - 'apps/web/lib/jargon.ts'
      - 'apps/web/package.json'
      - 'scripts/benchmark-jargon.js'

jobs:
  performance-budget:
    runs-on: ubuntu-latest
    name: Check JargonText Performance Budget

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run performance budget check
        run: bun scripts/benchmark-jargon.js
        env:
          WEB_DIR: ./apps/web

      - name: Run integration tests
        run: bun test lib/__tests__/feature-flags.test.ts
        working-directory: ./apps/web

      - name: TypeScript check
        run: bun run type-check
        working-directory: ./apps/web

      - name: Report results
        if: success()
        run: |
          echo "✅ Performance Budget: PASSED"
          echo "  • Render time measured and within budget"
          echo "  • Bundle size measured and within budget"
          echo "✅ Integration Tests: 46/46 PASSED"
          echo "✅ TypeScript: PASS"

      - name: Extract performance metrics
        id: metrics
        if: always()
        run: |
          echo "render_time=${{ env.PERF_RENDER_TIME }}" >> $GITHUB_OUTPUT
          echo "bundle_size=${{ env.PERF_BUNDLE_SIZE }}" >> $GITHUB_OUTPUT
          echo "tests_pass=${{ env.PERF_TESTS_PASS }}" >> $GITHUB_OUTPUT

      - name: Comment on PR with metrics
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const renderTime = process.env.PERF_RENDER_TIME || 'unknown';
            const bundleSize = process.env.PERF_BUNDLE_SIZE || 'unknown';

            const body = `## ✅ Performance Budget Check: PASSED

### Measured Metrics
- **Render time:** ${renderTime}ms / budget 20ms
- **Bundle size:** ${bundleSize}KB / budget 3KB
- **Integration tests:** 46/46 passing

### Budgets Status
✅ Render time: PASS
✅ Bundle size: PASS
✅ Tests: PASS

Performance is within acceptable range.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
