name: Performance Budget Check

on:
  push:
    branches:
      - translate-ukrainian-acfs
    paths:
      - 'apps/web/components/jargon.tsx'
      - 'apps/web/lib/feature-flags.ts'
      - 'apps/web/lib/__tests__/feature-flags.test.ts'
      - 'apps/web/package.json'
      - 'scripts/benchmark-jargon.js'
  pull_request:
    branches:
      - translate-ukrainian-acfs
    paths:
      - 'apps/web/components/jargon.tsx'
      - 'apps/web/lib/feature-flags.ts'
      - 'apps/web/lib/__tests__/feature-flags.test.ts'
      - 'apps/web/package.json'

jobs:
  performance-budget:
    runs-on: ubuntu-latest
    name: Check JargonText Performance Budget

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run performance budget check
        run: bun scripts/benchmark-jargon.js
        working-directory: ./apps/web

      - name: Run integration tests
        run: bun test lib/__tests__/feature-flags.test.ts
        working-directory: ./apps/web

      - name: TypeScript check
        run: bun run type-check
        working-directory: ./apps/web

      - name: Report results
        if: success()
        run: |
          echo "✅ Performance Budget: PASSED"
          echo "✅ Integration Tests: PASSED"
          echo "✅ TypeScript: PASSED"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Performance Budget Check: PASSED\n- Render time: <20ms per page\n- Bundle size: <3KB impact\n- Integration tests: 46/46 passing'
            })
